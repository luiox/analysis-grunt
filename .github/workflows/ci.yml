# grunt CI（docs + Linux + Windows）
#
# docs job：引用门禁 check_refs + Sphinx -W 构建 RST 站 + Doxygen 吃 src ///
# 注释（口径照 mjbase/libjbc 三段式；sphinx 9.1.1 / doxygen 1.18.0 双钉版）。
# 范围：grunt 静态库 + grunt_cli + grunt_unittest 全量单测（cff_unflatten /
# exc_bridge_restore 有 JVM 实跑验证检查，setup-java 常备 JDK 保证真跑；
# java 缺席时该类测试自跳，CI 不依赖这个退路）。
# 依赖：luiox-repo git 直连包（mjbase/libjbc/libca 等），root xmake.lua 内
# add_repositories 已指向 GitHub 远端，CI 无需显式注册（同 mjbase 口径）；
# gtest 走 xrepo。
# libjsim：luiox-repo 包消费（0.0.1），CI 与本地同一条包消费路径。
# 注意 set_defaultplat("windows")：Linux 配置必须显式 -p linux。

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (引用门禁 + Sphinx + Doxygen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        # 钉死本地实测通过的版本：-W 下警告集合随 Sphinx 小版本变，范围安装等于定时炸；升级随文档改动显式改这一行。
        run: python -m pip install --upgrade "sphinx==9.1.1"

      - name: Reference gate (check_refs)
        run: python doc/check_refs.py .

      # -E：增量缓存会跳过回到旧状态的文件，警告随之消失，等于没门禁。
      - name: "Build behavior ledger (-W: 警告即失败)"
        run: sphinx-build -b html -E -W --keep-going doc doc/_build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: grunt-doc-html
          path: doc/_build
          retention-days: 14

      # 微观层：Doxygen 只吃头文件 /// 注释，与 RST 站互不干涉。
      # 版本必须钉死（与本地实测同版）：Doxyfile 的 WARN_* 档随版本增减标签，
      # apt 里的老版本会把不认识的标签报成告警，WARN_AS_ERROR 下直接变红。
      - name: Install Doxygen (pinned 1.18.0)
        run: |
          curl -fsSL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz -o /tmp/dox.tar.gz
          mkdir -p "$HOME/doxygen"
          tar xzf /tmp/dox.tar.gz -C "$HOME/doxygen" --strip-components=1
          test -x "$HOME/doxygen/bin/doxygen"
          echo "$HOME/doxygen/bin" >> "$GITHUB_PATH"

      # GITHUB_PATH 的追加不回灌当前步，PATH 自本步起生效；版本打印放这里。
      - name: Build API docs (WARN_AS_ERROR)
        run: |
          doxygen --version
          doxygen doc/Doxyfile

      - name: Upload API site
        uses: actions/upload-artifact@v4
        with:
          name: grunt-doc-apidoc
          path: doc/_apidoc/html
          retention-days: 14

  build-and-test-linux:
    name: build & test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK (JVM 实跑验证检查)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: grunt-xrepo-linux-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            grunt-xrepo-linux-x64-xmake309-

      - name: Configure (with tests)
        run: xmake f -p linux --with_tests=y -y

      - name: Build
        run: |
          xmake build -y grunt_cli
          xmake build -y grunt_unittest

      - name: Run unit tests
        run: xmake run grunt_unittest --gtest_brief=1

  build-and-test-windows:
    name: build & test (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK (JVM 实跑验证检查)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake/packages
          key: grunt-xrepo-windows-x64-xmake309-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            grunt-xrepo-windows-x64-xmake309-

      - name: Configure (with tests)
        shell: bash
        run: xmake f -p windows --with_tests=y -y

      - name: Build
        shell: bash
        run: |
          xmake build -y grunt_cli
          xmake build -y grunt_unittest

      - name: Run unit tests
        shell: bash
        run: xmake run grunt_unittest --gtest_brief=1
